<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông báo eNetViet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4" style="max-width: 720px">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h1 class="h4 mb-0">Thông báo</h1>
    <button id="reload" class="btn btn-sm btn-outline-primary">Tải lại</button>
  </div>
  <p id="status" class="small text-secondary"></p>
  <div id="list" class="vstack gap-3"></div>
</main>
<script>
const API = 'https://iadd.ct.ws/api/enet.php';
const fmt = new Intl.DateTimeFormat('vi-VN', {
  timeZone: 'Asia/Ho_Chi_Minh', weekday: 'short', day: '2-digit', month: '2-digit',
  year: 'numeric', hour: '2-digit', minute: '2-digit', second: "2-digit"
});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const $ = id => document.getElementById(id);

const card = n => `
  <div class="card shadow-sm ${n.is_seen ? '' : 'border-primary'}">
    <div class="card-body">
      <div class="d-flex gap-2 align-items-center mb-2">
        <img src="${esc(n.icon)}" alt="" width="40" height="40" class="rounded-circle object-fit-cover">
        <div>
          <div class="fw-semibold">${esc(n.title)} ${n.is_seen ? '' : '<span class="badge text-bg-primary">Chưa đọc</span>'}</div>
          <div class="small text-secondary">${esc(n.sub_title)} · <time datetime="${esc(n.time)}">${fmt.format(new Date(n.time))}</time></div>
        </div>
      </div>
      <p class="card-text" style="white-space: pre-line">${esc(n.content?.text)}</p>
      ${/^https:\/\//.test(n.url) ? `<a href="${esc(n.url)}" target="_blank" rel="noopener" class="small">Xem chi tiết</a>` : ''}
    </div>
  </div>`;

async function load() {
  $('status').textContent = 'Đang tải…';
  try {
    const res = await fetch(API, { cache: 'no-store' });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch { throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`); }
    if (json.error_code !== 0) throw new Error(json.message);
    $('list').innerHTML = json.data.map(card).join('') || '<p class="text-secondary">Không có thông báo.</p>';
    $('status').textContent = `Cập nhật lúc ${fmt.format(new Date())} (GMT+7)`;
  } catch (e) {
    $('status').innerHTML = `<span class="text-danger">Lỗi: ${esc(e.message)}</span>`;
  }
}

$('reload').onclick = load;
load();
</script>
</body>
</html>
